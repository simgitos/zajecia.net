<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brak połączenia z internetem - Zajęciownia.pl</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css" />
  <style>
    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .offline-card {
      max-width: 440px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .offline-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: #fee2e2;
      color: #ef4444;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <i class="ti ti-wifi-off"></i>
    </div>
    <h2 class="fw-bold mb-2">Brak połączenia</h2>
    <p class="text-secondary mb-4">
      Nie masz połączenia z internetem. Sprawdź sieć Wi-Fi lub transmisję danych komórkowych i spróbuj ponownie.
    </p>
    <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" onclick="window.location.reload();">
      <i class="ti ti-rotate-2 me-1"></i> Spróbuj ponownie
    </button>
  </div>
</body>
</html>
